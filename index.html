<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign-up Form</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<div class="image-side">
			<figure>
				<img
					src="/green-grass-field-during-sunset.jpg"
					alt="Green grass field during sunset"
					srcset=""
				/>
				<figcaption>
					Photo by
					<a
						href="https://unsplash.com/@robertlukeman?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Robert Lukeman</a
					>
					on
					<a
						href="https://unsplash.com/photos/green-grass-field-during-sunset-_RBcxo9AU-U?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Unsplash</a
					>
				</figcaption>
			</figure>
			<div class="logo-section">logo</div>
		</div>
		<div class="text-side">
			<div class="text-side-container">
				<p>
					Lorem ipsum dolor sit, amet consectetur adipisicing elit.
					Ullam tempore quhasi veniam deleniti laboriosam perspiciatis
					eveniet, voluptatibus sequi numquam iste?
				</p>
				<p>Lorem ipsum, dolor sit amet consectetur adipisicing.</p>
				<form action="#" method="get">
					<fieldset>
						<legend>Let's do this!</legend>
						<div class="input-and-label">
							<label for="first-name">First Name</label>
							<input
								type="text"
								name="first-name"
								id="first-name"
							/>
						</div>
						<div class="input-and-label">
							<label for="last-name">Last Name</label>
							<input
								type="text"
								name="last-name"
								id="last-name"
							/>
						</div>
						<div class="input-and-label">
							<label for="email">Email</label>
							<input type="email" name="email" id="email" />
						</div>
						<div class="input-and-label">
							<label for="phone">Phone Number</label>
							<input type="tel" name="phone" id="phone" />
						</div>
						<div class="input-and-label">
							<label for="password">Password</label>
							<input
								type="password"
								name="password"
								id="password"
							/>
						</div>
						<div class="input-and-label">
							<label for="confirm-password"
								>Confirm Password</label
							>
							<input
								type="confirm-password"
								name="confirm-password"
								id="confirm-password"
							/>
						</div>
					</fieldset>
					<button type="submit">Creare Account</button>
				</form>

				<p>Already have an account? <a href="#">Log in</a></p>
			</div>
		</div>
	</body>
</html>
